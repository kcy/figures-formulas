<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Array Grid</title>
<meta name="description" content="Times tables as dot arrays on graph paper. The dots fade as you learn.">
<meta name="theme-color" content="#f7f5ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Kalam:wght@700&display=swap">
<link rel="stylesheet" href="../css/kit.css?v=__BUILD__">
<style>
/* Layout: full-screen graph-paper page; problem written at top in marker; dot array drawn on the grid; keypad at the bottom. Quiet notebook look. */
:root{--bg:#f7f5ee;--ink:#22304a;--ink-soft:#44506a;--ink-dim:#7c8598;--accent:#2f6fde;--accent-ink:#fff;--accent-deep:#1f4fa8;--card:#fffefa;--card-edge:#c9d3e6;--font:"Patrick Hand","Comic Sans MS",ui-rounded,system-ui,sans-serif;--font-num:"Kalam","Patrick Hand",ui-rounded,system-ui,sans-serif;--radius:10px;--scrim:rgba(34,48,74,.2);--tile:#eef2fa;color-scheme:light}
.card{transform:rotate(-.6deg)}.btn{border-radius:10px}.card h1{font-family:var(--font-num)}
</style>
</head>
<body>
<canvas id="stage" class="stage" aria-label="Graph paper with a dot array"></canvas>
<header class="hud">
  <div class="scorebox"><div class="score" id="hudScore">0</div><div class="sub" id="hudSub">Best 0</div></div>
  <div class="mid"><div class="clock" id="hudClock">60</div><div class="sub" id="hudMid"></div></div>
  <div class="right">
    <div class="tools">
      <a class="icon" href="../" title="Back to games" aria-label="Back to games">⌂</a>
      <button class="icon" id="btnPause" title="Pause" aria-label="Pause">❚❚</button>
      <button class="icon" id="btnSound" title="Sound" aria-label="Sound">♪</button>
    </div>
    <div class="meta"><span class="goal" id="hudGoal"></span><span class="sync" id="hudSync">LOCAL</span></div>
  </div>
</header>
<div class="keypad" id="keypad"></div>
<div id="overlay" class="overlay"></div>
<script src="../config.js?v=__BUILD__"></script>
<script src="../js/facts.js?v=__BUILD__"></script>
<script src="../js/scheduler.js?v=__BUILD__"></script>
<script src="../js/store.js?v=__BUILD__"></script>
<script src="../js/player.js?v=__BUILD__"></script>
<script src="../js/sync.js?v=__BUILD__"></script>
<script src="../js/kit.js?v=__BUILD__"></script>
<script src="arrays.js?v=__BUILD__"></script>
</body>
</html>
