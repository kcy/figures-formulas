<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Elevator Drop</title>
<meta name="description" content="An elevator rides a building whose floors are a number line. Tap the floor where it stops.">
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../css/kit.css?v=__BUILD__">
<style>
/* Layout: full-screen sky over soil; HUD floats on top; the building (floors = a vertical number line, negatives underground) sits right on wide screens, below the problem on tall ones. */
:root{--bg:#c9ecff;--ink:#16263d;--ink-soft:#33496a;--ink-dim:#5a6b82;--accent:#f2b632;--accent-ink:#2b1d00;--accent-deep:#b9821a;--card:#ffffff;--card-edge:#cfe3f2;--font:"Baloo 2",ui-rounded,system-ui,sans-serif;--radius:26px;--scrim:rgba(22,38,61,.3);--tile:#eef6fc;color-scheme:light}
</style>
</head>
<body>
<canvas id="stage" class="stage" aria-label="A building whose floors are numbers, with an elevator"></canvas>
<header class="hud">
  <div class="scorebox"><div class="score" id="hudScore">0</div><div class="sub" id="hudSub">Best 0</div></div>
  <div class="mid"><div class="clock" id="hudClock">1/12</div><div class="sub" id="hudMid"></div></div>
  <div class="right">
    <div class="tools">
      <a class="icon" href="../" title="Back to games" aria-label="Back to games">⌂</a>
      <button class="icon" id="btnPause" title="Pause" aria-label="Pause">❚❚</button>
      <button class="icon" id="btnSound" title="Sound" aria-label="Sound">♪</button>
    </div>
    <div class="meta"><span class="goal" id="hudGoal"></span><span class="sync" id="hudSync">LOCAL</span></div>
  </div>
</header>

<div id="overlay" class="overlay"></div>
<script src="../config.js?v=__BUILD__"></script>
<script src="../js/facts.js?v=__BUILD__"></script>
<script src="../js/scheduler.js?v=__BUILD__"></script>
<script src="../js/store.js?v=__BUILD__"></script>
<script src="../js/player.js?v=__BUILD__"></script>
<script src="../js/sync.js?v=__BUILD__"></script>
<script src="../js/kit.js?v=__BUILD__"></script>
<script src="elevator.js?v=__BUILD__"></script>
</body>
</html>
