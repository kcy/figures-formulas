<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pace Race</title>
<meta name="description" content="Type answers to drive. Beat your own pace car.">
<meta name="theme-color" content="#ff6b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,600;0,800;0,900;1,800;1,900&display=swap">
<link rel="stylesheet" href="../css/kit.css?v=__BUILD__">
<style>
/* Layout: full-screen side-view road under a bright sky; pinned problem card at the top; on-screen keypad at the bottom. Flat, bold, poster colors. */
:root{--bg:#ffe8c7;--ink:#1d1d3a;--ink-soft:#3e3e66;--ink-dim:#77779a;--accent:#ff6b35;--accent-ink:#fff;--accent-deep:#c94a1b;--card:#fffaf0;--card-edge:#1d1d3a;--font:"Rubik",system-ui,sans-serif;--radius:18px;--scrim:rgba(29,29,58,.3);--tile:#fff1dc;color-scheme:light}
.card{box-shadow:6px 6px 0 #1d1d3a}.card h1{font-style:italic;letter-spacing:-.02em}.clock{border-radius:10px}
</style>
</head>
<body>
<canvas id="stage" class="stage" aria-label="A race track with your car and a pace car"></canvas>
<header class="hud">
  <div class="scorebox"><div class="score" id="hudScore">0</div><div class="sub" id="hudSub">Best 0</div></div>
  <div class="mid"><div class="clock" id="hudClock">60</div><div class="sub" id="hudMid"></div></div>
  <div class="right">
    <div class="tools">
      <a class="icon" href="../" title="Back to games" aria-label="Back to games">⌂</a>
      <button class="icon" id="btnPause" title="Pause" aria-label="Pause">❚❚</button>
      <button class="icon" id="btnSound" title="Sound" aria-label="Sound">♪</button>
    </div>
    <div class="meta"><span class="goal" id="hudGoal"></span><span class="sync" id="hudSync">LOCAL</span></div>
  </div>
</header>
<div class="keypad" id="keypad"></div>
<div id="overlay" class="overlay"></div>
<script src="../config.js?v=__BUILD__"></script>
<script src="../js/facts.js?v=__BUILD__"></script>
<script src="../js/scheduler.js?v=__BUILD__"></script>
<script src="../js/store.js?v=__BUILD__"></script>
<script src="../js/player.js?v=__BUILD__"></script>
<script src="../js/sync.js?v=__BUILD__"></script>
<script src="../js/kit.js?v=__BUILD__"></script>
<script src="race.js?v=__BUILD__"></script>
</body>
</html>
