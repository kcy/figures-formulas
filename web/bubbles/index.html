<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bubble Pop</title>
<meta name="description" content="Bubbles drift up carrying answers. Pop the right one.">
<meta name="theme-color" content="#3b2a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="../css/kit.css?v=__BUILD__">
<style>
/* Layout: full-screen deep-water scene; HUD floats on top; pinned question card under it; bubbles rise from the bottom. Calm dusk-purple to teal water. */
:root{--bg:#1e1b4b;--ink:#f4f0ff;--ink-soft:#d4ccf5;--ink-dim:#a29bd0;--accent:#7ee8d6;--accent-ink:#0b2b2a;--accent-deep:#3fb8a3;--card:#2a2560;--card-edge:#4a438a;--font:"Nunito",ui-rounded,system-ui,sans-serif;--radius:30px;--scrim:rgba(15,10,40,.45);--tile:rgba(255,255,255,.06);color-scheme:dark}

</style>
</head>
<body>
<canvas id="stage" class="stage" aria-label="Underwater scene with rising bubbles"></canvas>
<header class="hud">
  <div class="scorebox"><div class="score" id="hudScore">0</div><div class="sub" id="hudSub">Best 0</div></div>
  <div class="mid"><div class="clock" id="hudClock">60</div><div class="sub" id="hudMid"></div></div>
  <div class="right">
    <div class="tools">
      <a class="icon" href="../" title="Back to games" aria-label="Back to games">⌂</a>
      <button class="icon" id="btnPause" title="Pause" aria-label="Pause">❚❚</button>
      <button class="icon" id="btnSound" title="Sound" aria-label="Sound">♪</button>
    </div>
    <div class="meta"><span class="goal" id="hudGoal"></span><span class="sync" id="hudSync">LOCAL</span></div>
  </div>
</header>

<div id="overlay" class="overlay"></div>
<script src="../config.js?v=__BUILD__"></script>
<script src="../js/facts.js?v=__BUILD__"></script>
<script src="../js/scheduler.js?v=__BUILD__"></script>
<script src="../js/store.js?v=__BUILD__"></script>
<script src="../js/player.js?v=__BUILD__"></script>
<script src="../js/sync.js?v=__BUILD__"></script>
<script src="../js/kit.js?v=__BUILD__"></script>
<script src="bubbles.js?v=__BUILD__"></script>
</body>
</html>
